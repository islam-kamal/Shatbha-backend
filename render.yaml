# https://render.com/docs/blueprint-spec
# PHP is not a native Render runtime — Laravel must deploy as Docker.
# Dashboard: New → Blueprint → connect this Git repo.
# Both services use Render's free plans (web spins down after 15 min idle;
# free Postgres expires after 30 days). Upgrade plan values to keep it always-on.

databases:
  - name: shatbha-db
    plan: free
    databaseName: shatbha
    user: shatbha
    ipAllowList: [] # API uses the internal URL only

services:
  - type: web
    name: shatbha-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # paste `php artisan key:generate --show` from your machine
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: shatbha-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: shatbha-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
